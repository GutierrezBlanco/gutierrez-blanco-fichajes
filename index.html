<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gutiérrez Blanco</title>

 <style>
   body {
     margin: 0;
     font-family: Arial, sans-serif;
     background: #f4f4f4;
     display: flex;
     justify-content: center;
     align-items: center;
     min-height: 100vh;
   }

   .contenedor {
     background: white;
     width: 90%;
     max-width: 420px;
     padding: 40px 25px;
     text-align: center;
     border-radius: 15px;
     box-shadow: 0 4px 15px rgba(0,0,0,0.15);
   }

   h1 {
     margin-bottom: 10px;
     font-size: 34px;
   }

   p {
     color: #666;
     margin-bottom: 25px;
   }

   input {
     width: 100%;
     box-sizing: border-box;
     padding: 14px;
     margin-bottom: 15px;
     border: 1px solid #ccc;
     border-radius: 8px;
     font-size: 17px;
   }

   button {
     width: 100%;
     background: #1f7a3a;
     color: white;
     border: none;
     padding: 15px;
     border-radius: 8px;
     font-size: 18px;
     font-weight: bold;
     cursor: pointer;
   }

   .oculto {
     display: none;
   }

   .volver {
     margin-top: 15px;
     background: #777;
   }
 </style>
</head>

<body>

 <div class="contenedor">

   <div id="inicio">
     <h1>Gutiérrez Blanco</h1>
     <p>Gestión de trabajadores y jornadas</p>

     <button onclick="mostrarLogin()">
       Iniciar sesión
     </button>
   </div>

   <div id="login" class="oculto">
     <h1>Iniciar sesión</h1>

     <p>Introduce tus datos</p>

     <input
       type="tel"
       id="telefono"
       placeholder="Teléfono"


     <input
       type="password"
       id="pin"
       placeholder="PIN"
       inputmode="numeric"


     <button onclick="entrar()">
       Entrar
     </button>

     <button class="volver" onclick="volver()">
       Volver
     </button>
   </div>

 </div>

 <script>
   function mostrarLogin() {
     document.getElementById("inicio").classList.add("oculto");
     document.getElementById("login").classList.remove("oculto");
   }

   function volver() {
     document.getElementById("login").classList.add("oculto");
     document.getElementById("inicio").classList.remove("oculto");
   }

   function entrar() {
     alert("El acceso se conectará con la base de datos en el siguiente paso.");
   }
 </script>

</body>
</html>

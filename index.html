<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Gutiérrez Blanco</title>

 <style>
   body {
     margin: 0;
     font-family: Arial, sans-serif;
     background: #f4f4f4;
     display: flex;
     justify-content: center;
     align-items: center;
     min-height: 100vh;
   }

   .contenedor {
     background: white;
     width: 90%;
     max-width: 420px;
     padding: 40px 25px;
     text-align: center;
     border-radius: 15px;
     box-shadow: 0 4px 15px rgba(0,0,0,0.15);
   }

   h1 {
     margin-bottom: 10px;
     font-size: 34px;
   }

   p {
     color: #666;
     margin-bottom: 30px;
   }

   .boton {
     display: block;
     background: #1f7a3a;
     color: white;
     text-decoration: none;
     padding: 15px;
     border-radius: 8px;
     font-size: 18px;
     font-weight: bold;
   }
 </style>
</head>

<body>

 <div class="contenedor">
   <h1>Gutiérrez Blanco</h1>

   <p>Gestión de trabajadores y jornadas</p>

   <a class="boton" href="#">Iniciar sesión</a>
 </div>

</body>
</html>
